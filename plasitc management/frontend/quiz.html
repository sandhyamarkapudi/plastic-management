<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Test your plastic management awareness, resin codes knowledge, and segregation habits in a 2-minute quiz.">
  <title>Plastic Awareness Quiz | EcoVillage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="site-nav"></div>

  <header class="page-head">
    <div class="container text-center">
      <span class="eyebrow"><i class="fa-solid fa-award"></i> Awareness Challenge</span>
      <h1>Plastic Management Quiz</h1>
      <p class="lead mb-0 mx-auto" style="max-width: 650px;">
        Answer 10 practical questions to test your everyday eco habits. Receive your score instantly with clear explanations.
      </p>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width: 820px;">
      <div id="quizResult"></div>

      <div id="quizFormContainer">
        <form id="quizForm">
          <div class="card p-5 text-center shadow-sm border-0">
            <div class="spinner-border text-success mx-auto mb-3" role="status" style="width: 3rem; height: 3rem;"></div>
            <h3 class="h5 text-dark">Preparing Your Quiz...</h3>
            <p class="small text-muted mb-0">Loading questions on segregation, resin codes, and village safety.</p>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
