<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Content | Admin EcoVillage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-shell">
  <div id="site-nav"></div>

  <main data-admin-page class="section py-4">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <span class="eyebrow"><i class="fa-solid fa-file-pen"></i> Content Management</span>
          <h1 class="h3 mb-0">Publish & Manage Awareness Content</h1>
        </div>
        <a href="dashboard.html" class="btn btn-soft btn-sm">
          <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
      </div>

      <form id="contentForm" class="card p-4 shadow-sm border-0 mb-4" style="border-radius: var(--radius-lg);">
        <h2 class="h5 mb-3"><i class="fa-solid fa-plus-circle text-success me-1"></i> Add New Awareness Item</h2>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Article Title</label>
            <input class="form-control" name="title" placeholder="e.g. Village Composting Best Practices" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Category</label>
            <input class="form-control" name="category" placeholder="e.g. Segregation / Recycling" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Language</label>
            <select class="form-select" name="language">
              <option value="en">English</option>
              <option value="te">Telugu (తెలుగు)</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Content Description / Advice</label>
            <textarea class="form-control" name="description" rows="3" placeholder="Enter clear, simple awareness guidance..." required></textarea>
          </div>
          <div class="col-12">
            <button class="btn btn-primary">
              <i class="fa-solid fa-paper-plane me-1"></i> Publish Content
            </button>
          </div>
        </div>
      </form>

      <h2 class="h5 mb-3">Published Items</h2>
      <div class="row g-3" id="contentList"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const list = document.querySelector('#contentList');
      const load = async () => {
        try {
          const r = await api('/content');
          if (r && r.data && r.data.length) {
            list.innerHTML = r.data.map(i => `
              <div class="col-md-6">
                <div class="card p-4 h-100 border-0 shadow-xs">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="badge-soft badge-soft-emerald">${i.category || 'General'}</span>
                    <span class="small text-muted">${i.language === 'te' ? 'తెలుగు' : 'English'}</span>
                  </div>
                  <h3 class="h5 mb-2">${i.title}</h3>
                  <p class="small text-muted mb-3">${i.description}</p>
                  <button class="btn btn-outline-danger btn-sm mt-auto" data-id="${i.id}">
                    <i class="fa-solid fa-trash-can me-1"></i> Delete
                  </button>
                </div>
              </div>
            `).join('');
            list.querySelectorAll('[data-id]').forEach(b => {
              b.onclick = async () => {
                if (confirm('Are you sure you want to remove this item?')) {
                  await api('/content/' + b.dataset.id, { method: 'DELETE' });
                  load();
                }
              };
            });
          } else {
            list.innerHTML = '<div class="col-12"><div class="alert alert-info border-0">No custom content items added yet. Add one above!</div></div>';
          }
        } catch (e) {
          list.innerHTML = '<div class="col-12"><div class="alert alert-warning border-0">Custom content will be loaded when the backend server is active.</div></div>';
        }
      };

      await load();

      document.querySelector('#contentForm').onsubmit = async (e) => {
        e.preventDefault();
        try {
          await api('/content', {
            method: 'POST',
            body: JSON.stringify(Object.fromEntries(new FormData(e.target)))
          });
          toast('Content published successfully!');
          e.target.reset();
          load();
        } catch (err) {
          toast(err.message, false);
        }
      };
    });
  </script>
</body>
</html>
