<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learner Feedback | Admin EcoVillage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-shell">
  <div id="site-nav"></div>

  <main data-admin-page class="section py-4">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <span class="eyebrow"><i class="fa-solid fa-comments"></i> Community Insights</span>
          <h1 class="h3 mb-0">Learner Feedback & Suggestions</h1>
        </div>
        <a href="dashboard.html" class="btn btn-soft btn-sm">
          <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
      </div>

      <div class="card border-0 shadow-sm overflow-hidden" style="border-radius: var(--radius-lg);">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
              <tr>
                <th class="py-3 px-4">Name</th>
                <th class="py-3 px-4">Village</th>
                <th class="py-3 px-4">Rating</th>
                <th class="py-3 px-4">Message / Suggestion</th>
              </tr>
            </thead>
            <tbody id="adminTable">
              <tr>
                <td colspan="4" class="text-center py-4 text-muted">
                  <div class="spinner-border spinner-border-sm text-success me-2" role="status"></div>
                  Loading feedback entries...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
