<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Administrative access portal for EcoVillage plastic awareness platform.">
  <title>Admin Portal Login | EcoVillage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-light">
  <main class="section py-5">
    <div class="container" style="max-width: 480px;">
      <div class="text-center mb-4">
        <span class="brand-emblem mx-auto mb-3" style="width: 58px; height: 58px; font-size: 1.6rem;">
          <i class="fa-solid fa-shield-halved"></i>
        </span>
        <h1 class="h3 text-dark mb-1">EcoVillage Admin Portal</h1>
        <p class="small text-muted mb-0">Management console for awareness modules & village feedback.</p>
      </div>

      <div class="card p-4 p-md-5 shadow-lg border-0" style="border-radius: var(--radius-xl); background: #ffffff;">
        <form id="adminLogin">
          <div class="mb-3">
            <label class="form-label" for="adminMobile">
              <i class="fa-solid fa-phone text-muted me-1"></i> Admin Mobile
            </label>
            <input id="adminMobile" class="form-control" name="mobile" placeholder="Administrator mobile number" required>
          </div>

          <div class="mb-4">
            <label class="form-label" for="adminPassword">
              <i class="fa-solid fa-key text-muted me-1"></i> Password
            </label>
            <input id="adminPassword" class="form-control" name="password" type="password" placeholder="Admin security password" required>
          </div>

          <button class="btn btn-primary btn-lg w-100" type="submit">
            <span>Secure Admin Login</span>
            <i class="fa-solid fa-lock ms-1"></i>
          </button>

          <p id="error" class="text-danger small mt-3 mb-0 text-center fw-semibold"></p>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <a href="../index.html" class="small text-muted text-decoration-none">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to EcoVillage Home
          </a>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/main.js"></script>
  <script>
    document.querySelector('#adminLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.querySelector('#error');
      errEl.textContent = '';
      try {
        const data = await api('/users/login', {
          method: 'POST',
          body: JSON.stringify(Object.fromEntries(new FormData(e.target)))
        });
        if (data.user.role !== 'admin') {
          throw new Error('This account does not have administrator privileges.');
        }
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        location.href = 'dashboard.html';
      } catch (err) {
        errEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
